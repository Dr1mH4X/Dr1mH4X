name: Update Profile Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Dr1mH4X
          template: classic
          base: activity, community, metadata
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          filename: metrics/github-metrics.svg
          output_action: none

      - name: Collect metrics output
        run: sudo cp /metrics_renders/metrics/github-metrics.svg metrics/github-metrics.svg

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics/github-metrics.svg
          if-no-files-found: error

  snake-animation:
    needs: github-metrics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/github-contribution-grid-snake.svg
            snake/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Upload snake
        uses: actions/upload-artifact@v4
        with:
          name: snake
          path: snake/github-contribution-grid-snake*.svg
          if-no-files-found: error

  used-by-cards:
    needs: snake-animation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate used by assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python used_by/scripts/generate_used_by.py --config used_by/tsclient-rs/used-by-repositories.json --output used_by/tsclient-rs

      - name: Upload used by
        uses: actions/upload-artifact@v4
        with:
          name: used-by
          path: used_by/tsclient-rs
          if-no-files-found: error

  commit-assets:
    needs: [github-metrics, snake-animation, used-by-cards]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download metrics
        uses: actions/download-artifact@v4
        with:
          name: metrics
          path: metrics

      - name: Download snake
        uses: actions/download-artifact@v4
        with:
          name: snake
          path: snake

      - name: Download used by
        uses: actions/download-artifact@v4
        with:
          name: used-by
          path: used_by/tsclient-rs

      - name: Commit and push assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics snake used_by
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "chore: update profile assets"
          git pull --rebase --autostash origin main
          git push origin main